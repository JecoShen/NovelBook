name: Code Baseline

on:
  # main 允许直推、没有 PR 评审，代码门禁必须覆盖 push 才有约束力。
  # 这里不加 paths 过滤：baseline-change-scope.ts 对非 pull_request 事件一律返回全量作用域，
  # 过滤只会让部分 main 提交完全不过门禁。
  push:
    branches: [main]
  pull_request:
    paths:
      - ".agents/**"
      - ".omp/**"
      - "AGENTS.md"
      - "WATCHDOG.md"
      - "README.md"
      - "README.en.md"
      - "PROJECT-STATUS.md"
      - "docs/**"
      - "packages/neuro-book/**"
      - "packages/neuro-book-contracts/**"
      - "packages/neuro-book-test-support/**"
      - "packages/neuro-book-manager/**"
      - "packages/owned-process/**"
      - "packages/file-snapshot-cache/**"
      - "packages/nb-history/**"
      - "packages/nb-workflow/**"
      - "packages/nb-memory/**"
      - "packages/nb-ui/**"
      - "packages/neuro-agent-harness/**"
      - "packages/llmlint/**"
      - "packages/neuro-book/assets/**"
      - "plugins/**"
      - "scripts/**"
      - "packages/*/AGENTS.md"
      - "packages/neuro-book/nuxt.config.ts"
      - "packages/neuro-book/prisma.config.ts"
      - "packages/neuro-book/*.d.ts"
      - "packages/neuro-book/.env.example"
      - "packages/neuro-book/.env.docker.example"
      - "packages/neuro-book/Dockerfile*"
      - "bunfig.toml"
      - "packages/neuro-book/config.example.yaml"
      - "packages/neuro-book/docker-compose*.yml"
      - "packages/neuro-book/release-state-migration.json"
      - "packages/neuro-book/tsconfig.json"
      - "packages/neuro-book/uno.config.ts"
      - "packages/neuro-book/vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/code-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.scope.outputs.typecheck }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Select baseline scopes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            # base 取 PR 的目标分支，不写死分支名：本仓默认分支是 main，上游是 master，
            # 写死会让其中一侧解析不到 ref，整步失败并连带静默跳过 typecheck 与 tests。
            # 只有 pull_request 需要 diff——baseline-change-scope.ts 对其余事件一律返回全量作用域。
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              git diff --name-only "$(git merge-base "origin/${BASE_REF}" HEAD)" HEAD
            fi | bun scripts/ci/baseline-change-scope.ts
          } >> "$GITHUB_OUTPUT"

  governance:
    name: Governance and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Check governance
        run: bun run governance:check
      - name: Typecheck repository scripts
        run: bun x tsc --noEmit -p scripts/tsconfig.json
      - name: Check workflow and Docker contracts
        # scripts/typecheck/** 的两个用例此前不在任何 vitest 收集面内（scripts/vitest.config.ts
        # 的 include 漏了该目录，且全仓没有一处跑该 config 的全量）——测试在仓库里却从不执行。
        run: bun x vitest run --config scripts/vitest.config.ts scripts/ci/agent-governance.test.ts scripts/ci/workspace-workflows.test.ts scripts/build/dockerfile-contract.test.ts scripts/typecheck/non-desktop-runner.test.ts scripts/typecheck/project-graph.test.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Generate Prisma clients
        run: bun run --cwd packages/neuro-book generate
      - name: Run typecheck
        run: bun run --cwd packages/neuro-book typecheck

  test:
    name: Full tests
    runs-on: ubuntu-latest
    # worker=1 串行全量实测约 27 分钟；60 分钟保留两倍以上余量，
    # 用于区分「内存抖动濒停」与「真挂死」（30 分钟超时曾四轮全灭，死前 7 分钟零输出）。
    # 恢复并行或测试规模显著变化时应重测后回写此值。
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Generate Prisma clients
        run: bun run --cwd packages/neuro-book generate
      - name: Generate Nuxt types
        # Vitest 配置和应用包 tsconfig 依赖 packages/neuro-book/.nuxt/tsconfig.json。
        run: bun run --cwd packages/neuro-book nuxt:prepare
      - name: Install test runtime dependencies
        # Agent bash 合同会真实执行 rg；GitHub Ubuntu runner 不保证预装 ripgrep。
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run full tests
        # --maxWorkers=1：7GB runner 上 2 个重 worker（单 Project fixture 加载 14×27.3MiB
        # profile artifact）+ 每进程 4GB heap 上限 = 内存抖动濒停。串行牺牲墙钟换确定性。
        run: bun run --cwd packages/neuro-book test -- --reporter=dot --maxWorkers=1
      - name: Run bun-native tests
        # lore 套件用 bun:test，已被 vitest.config.ts exclude（vitest 解析不了 'bun:test'）；
        # 独立 runner 补回覆盖，勿并入 vitest 全量。
        run: bun run --cwd packages/neuro-book test:lore
