name: Deploy Docs

on:
  push:
    # 本仓默认分支是 main；上游用 master。跟随上游合并时此处会被改回 master，
    # 那样本仓不存在该分支，workflow 静默失效。改动本行前先确认 origin 分支名。
    branches: [main]
    paths:
      - docs/**
      - vitepress/**
      - packages/neuro-book/assets/reference/**
      - packages/llmlint/docs/promo/**
      - AGENTS.md
      - WATCHDOG.md
      - CONTEXT.md
      - CONTRIBUTING.md
      - CONTRIBUTING.en.md
      - PROJECT-STATUS.md
      - README.md
      - README.en.md
      - RELEASE.md
      - .omp/**
      - .github/workflows/deploy-docs.yml
      - patches/**
      - scripts/ci/validate-nitropack-patch.ts
      - scripts/ci/check-documentation*
      - scripts/ci/stage-docs-locales*
      - packages/neuro-book/**
      - packages/neuro-book/nuxt.config.ts
      - packages/neuro-book/tsconfig.json
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check patched Nitro modules
        run: bun scripts/ci/validate-nitropack-patch.ts

      - name: Prepare Nuxt types
        run: bun run --cwd packages/neuro-book nuxt:prepare
      - name: Check documentation governance
        run: bun run docs:check

      - name: Build with VitePress
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vitepress/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
